apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-service

  template:
    metadata:
      labels:
        app: devops-service

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: devops-service

          image: us-central1-docker.pkg.dev/devops-assessment-bp/docker-images/devops-service:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: API_KEY

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
